<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f4f4f9;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: left;
    }
    th {
      background: #0078d7;
      color: white;
    }
    tr:nth-child(even) {
      background: #f9f9f9;
    }
    .status-true {
      color: green;
      font-weight: bold;
    }
    .status-false {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>User List</h1>
  <table id="userTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>User Name</th>
        <th>Email</th>
        <th>Full Name</th>
        <th>Date of Birth</th>
        <th>Gender</th>
        <th>Phone</th>
        <th>Occupation</th>
        <th>Status</th>
        <th>Updated At</th>
      </tr>
    </thead>
    <tbody>
      <!-- Data will be inserted here -->
    </tbody>
  </table>

  <script>
    async function loadUsers() {
      try {
        const response = await fetch("http://localhost:26898/api/UserApi/GetAllUsers");
        const result = await response.json();

        const users = result.datas || [];
        const tbody = document.querySelector("#userTable tbody");
        tbody.innerHTML = "";

        users.forEach(user => {
          const row = document.createElement("tr");

          row.innerHTML = `
            <td>${user.id}</td>
            <td>${user.userName}</td>
            <td>${user.email}</td>
            <td>${user.fullName}</td>
            <td>${user.dateOfBirth}</td>
            <td>${user.gender}</td>
            <td>${user.phoneNumber}</td>
            <td>${user.occupation}</td>
            <td class="${user.status ? 'status-true' : 'status-false'}">${user.status}</td>
            <td>${user.updatedAt}</td>
          `;

          tbody.appendChild(row);
        });
      } catch (error) {
        console.error("Error fetching users:", error);
      }
    }

    // Load users when page opens
    loadUsers();
  </script>
</body>
</html>
